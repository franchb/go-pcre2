name: Fuzz

# Nightly: each fuzz target for 20 minutes, starting from the corpus the
# previous night left in the cache. CI runs the same targets for 30 s on
# every push. A failing input is uploaded as an artifact; commit it under
# testdata/fuzz/<Target>/ with the fix, and plain go test replays it from
# then on. See docs/FUZZING.md.

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per target
        default: 20m

permissions:
  contents: read

env:
  FUZZTIME: ${{ inputs.fuzztime || '20m' }}

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzCompile, FuzzMatch, FuzzCallout, FuzzDifferential]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build native PCRE2 with JIT
        if: matrix.target == 'FuzzDifferential'
        run: |
          PREFIX="$RUNNER_TEMP/pcre2" buildtools/native/build.sh
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/pcre2/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "TAGS=pcre2_cgo" >> "$GITHUB_ENV"

      # setup-go's own cache would also restore $GOCACHE/fuzz, keyed by
      # go.sum rather than by target, so it is off here.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Locate the fuzz cache
        run: echo "FUZZCACHE=$(go env GOCACHE)/fuzz" >> "$GITHUB_ENV"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.FUZZCACHE }}
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.target }}-

      - name: Fuzz
        run: go test -tags "${TAGS:-}" -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime "$FUZZTIME" .

      - name: Keep failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures-${{ matrix.target }}
          path: testdata/fuzz
          if-no-files-found: ignore
